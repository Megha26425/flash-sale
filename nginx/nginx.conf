worker_processes auto;

events {
    worker_connections 10240;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    gzip          on;
    gzip_types    text/css application/javascript application/json;

    # Docker gives every `api` replica the same DNS name, so this spreads traffic across all of them.
    upstream api {
        least_conn;
        server api:8000;
        keepalive 64;
    }

    # Per-IP limits. A human can't click Buy more than a few times a second; scripts can.
    limit_req_zone  $binary_remote_addr zone=checkout:20m rate=5r/s;
    limit_req_zone  $binary_remote_addr zone=reads:20m    rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=perip:20m;
    limit_req_status  429;
    limit_conn_status 429;

    # Turn away obvious scripts on the checkout endpoint.
    map $http_user_agent $is_bot {
        default                                         0;
        ""                                              1;
        ~*(curl|wget|python|httpclient|scrapy|headless) 1;
    }

    # Stock count is the same for everyone, so serve it from a 1-second cache.
    proxy_cache_path /var/cache/nginx keys_zone=sale:1m max_size=10m;

    server {
        listen 80;
        root /usr/share/nginx/html;

        limit_conn perip 20;

        location = / {
            add_header Cache-Control "no-cache";
            try_files /index.html =404;
        }

        location ~* \.(js|css)$ {
            expires 1h;
        }

        location = /api/checkout {
            if ($is_bot) { return 403; }
            limit_req zone=checkout burst=10 nodelay;
            proxy_pass http://api;
            include proxy_params.conf;
        }

        location = /api/sale {
            limit_req zone=reads burst=40 nodelay;
            proxy_cache sale;
            proxy_cache_valid 200 1s;
            proxy_cache_lock on;                 # one request refreshes the cache, the rest wait for it
            proxy_cache_use_stale updating error timeout;
            proxy_pass http://api;
            include proxy_params.conf;
        }

        location /api/ {
            limit_req zone=reads burst=40 nodelay;
            proxy_pass http://api;
            include proxy_params.conf;
        }
    }
}
