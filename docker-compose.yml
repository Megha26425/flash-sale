x-app: &app
  build: ./backend
  restart: unless-stopped
  environment:
    DB_HOST: mysql
    DB_PASSWORD: ${DB_PASSWORD:-root}
    REDIS_URL: redis://redis:6379/0
    RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    SALE_START: ${SALE_START:-}
  depends_on:
    mysql: { condition: service_healthy }
    redis: { condition: service_healthy }
    rabbitmq: { condition: service_healthy }

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
    volumes:
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      - mysql-data:/var/lib/mysql
    ports: ["3306:3306"]
    healthcheck:
      test: mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes   # keep the stock counter if Redis restarts
    volumes: [redis-data:/data]
    ports: ["6379:6379"]
    healthcheck:
      test: redis-cli ping
      interval: 5s

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports: ["5672:5672", "15672:15672"]   # 15672 is the web dashboard (guest/guest)
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 5s
      retries: 20

  worker:
    <<: *app
    command: python worker.py
    deploy: { replicas: 2 }

  api:
    <<: *app
    deploy: { replicas: 3 }

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/proxy_params.conf:/etc/nginx/proxy_params.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    ports: ["8080:80"]
    depends_on: [api]

volumes:
  mysql-data:
  redis-data:
